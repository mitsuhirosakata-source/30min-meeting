<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30min meeting</title>
    <!-- JSZip ライブラリ（CDN） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver ライブラリ（CDN） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 8px; font-family: Arial, sans-serif; box-sizing: border-box; }
        textarea { min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .action-item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        .action-row { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr; gap: 10px; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; border: none; }
        .btn-secondary { background: #6c757d; color: white; border: none; }
        .btn-success { background: #28a745; color: white; border: none; }
        button:hover { opacity: 0.9; }
        .download-section { margin-top: 30px; padding: 20px; background-color: #f0f8ff; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>30min meeting</h1>
    <p style="color: #666; font-size: 14px;">💡 ブラウザだけで完結！ボタンをクリックするだけで Word/テキスト形式で保存できます</p>

    <form id="meetingForm">
        <h2>1. 会議の概要</h2>
        <div class="form-group">
            <label>会議のタイトル</label>
            <input type="text" name="title" placeholder="例：〇〇プロジェクト進捗会議" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>日付</label>
                <input type="date" name="date" required>
            </div>
            <div class="form-group">
                <label>開始時刻</label>
                <input type="time" name="time_start" value="09:00" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>終了時刻</label>
                <input type="time" name="time_end" value="09:30" required>
            </div>
            <div class="form-group">
                <label>場所</label>
                <input type="text" name="location" placeholder="例：オンライン（Teams）/ 〇〇会議室" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>参加者（カンマ区切り）</label>
                <input type="text" name="participants" placeholder="例：山田太郎、鈴木花子、佐藤次郎" required>
            </div>
            <div class="form-group">
                <label>議事録作成者</label>
                <input type="text" name="creator" placeholder="例：山田太郎" required>
            </div>
        </div>

        <h2>2. 本日のゴール（開始5分で確認）</h2>
        <div class="form-group">
            <label>会議の目的・ゴール</label>
            <textarea name="goal" placeholder="例：〇〇プロジェクトの遅れに対するリカバリー策の決定" required></textarea>
        </div>

        <h2>3. 議論・傾聴内容（「口2：耳8」の記録）</h2>
        <div class="form-group">
            <label>【課題・現状の共有】メンバーからの意見・報告</label>
            <textarea name="issues" placeholder="例：〇〇の件について、現在〇〇という問題が発生している。"></textarea>
        </div>
        <div class="form-group">
            <label>【主な議論・アイデア】</label>
            <textarea name="discussion" placeholder="例：〇〇を省略して、先に〇〇を進めてはどうか？"></textarea>
        </div>
        <div class="form-group">
            <label>【意思決定・結論】マネジメントの判断</label>
            <textarea name="decision" placeholder="例：〇〇の方向性で進める。他部署への調整は〇〇が引き受ける。"></textarea>
        </div>

        <h2>4. ネクストアクション（誰が・何を・いつまでに）</h2>
        <div id="actionsContainer"></div>
        <button type="button" class="btn-secondary" onclick="addAction()">+ タスクを追加</button>

        <h2>5. 次回開催について</h2>
        <div class="form-group">
            <label>次回開催の予定</label>
            <textarea name="next_meeting" placeholder="例：本会議は定例化せず、上記ネクストアクションの進捗および新たな課題が発生したタイミングで適宜招集する。"></textarea>
        </div>

        <div class="download-section">
            <h3 style="margin-top: 0;">📥 ダウンロード</h3>
            <button type="button" class="btn-success" onclick="generateWord()" style="margin-right: 10px;">📄 Word形式でダウンロード</button>
            <button type="button" class="btn-primary" onclick="generateText()">📝 テキスト形式でダウンロード</button>
            <button type="reset" class="btn-secondary" style="margin-left: 10px;">🔄 リセット</button>
        </div>
    </form>

    <script>
        let actionCount = 0;

        function addAction() {
            const container = document.getElementById('actionsContainer');
            const actionId = actionCount++;
            const actionHtml = `
                <div class="action-item" id="action-${actionId}">
                    <div class="action-row">
                        <div class="form-group">
                            <label>担当者</label>
                            <input type="text" name="assignee_${actionId}" placeholder="山田">
                        </div>
                        <div class="form-group">
                            <label>タスク内容</label>
                            <input type="text" name="task_${actionId}" placeholder="〇〇に関する修正案の作成">
                        </div>
                        <div class="form-group">
                            <label>期限</label>
                            <input type="date" name="deadline_${actionId}">
                        </div>
                        <div class="form-group">
                            <label>ステータス</label>
                            <select name="status_${actionId}">
                                <option>未着手</option>
                                <option>進行中</option>
                                <option>完了</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-secondary" onclick="removeAction(${actionId})">削除</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', actionHtml);
        }

        function removeAction(id) {
            const element = document.getElementById(`action-${id}`);
            if (element) element.remove();
        }

        // 初期状態で1つのアクションを追加
        addAction();

        // テキスト形式で生成
        function generateText() {
            const formData = new FormData(document.getElementById('meetingForm'));

            let text = `【議事録】${formData.get('title')}
`;
            text += `
`;
            text += `1. 会議の概要
`;
            text += `日時: ${formData.get('date')} ${formData.get('time_start')} 〜 ${formData.get('time_end')}
`;
            text += `場所: ${formData.get('location')}
`;
            text += `参加者: ${formData.get('participants')}
`;
            text += `議事録作成者: ${formData.get('creator')}
`;
            text += `
`;
            text += `2. 本日のゴール（開始5分で確認）
`;
            text += `${formData.get('goal')}
`;
            text += `
`;
            text += `3. 議論・傾聴内容（「口2：耳8」の記録）
`;

            if (formData.get('issues')) {
                text += `【課題・現状の共有】
${formData.get('issues')}

`;
            }
            if (formData.get('discussion')) {
                text += `【主な議論・アイデア】
${formData.get('discussion')}

`;
            }
            if (formData.get('decision')) {
                text += `【意思決定・結論】
${formData.get('decision')}

`;
            }

            text += `4. ネクストアクション（誰が・何を・いつまでに）
`;

            for (let i = 0; i < actionCount; i++) {
                const assignee = formData.get(`assignee_${i}`);
                if (assignee) {
                    const task = formData.get(`task_${i}`);
                    const deadline = formData.get(`deadline_${i}`);
                    const status = formData.get(`status_${i}`);
                    text += `担当者: ${assignee} | タスク: ${task} | 期限: ${deadline} | ステータス: ${status}
`;
                }
            }

            text += `
`;
            text += `5. 次回開催について
`;
            text += `${formData.get('next_meeting')}
`;

            const blob = new Blob([text], { type: 'text/plain; charset=utf-8' });
            saveAs(blob, `議事録_${formData.get('date')}.txt`);
            alert('✅ テキスト形式でダウンロードしました！');
        }

        // Word形式で生成（正しいDOCX形式）
        function generateWord() {
            const formData = new FormData(document.getElementById('meetingForm'));

            try {
                // JSZip と FileSaver が読み込まれているか確認
                if (typeof JSZip === 'undefined') {
                    alert('❌ JSZip ライブラリが読み込まれていません。インターネット接続を確認してください。');
                    return;
                }
                if (typeof saveAs === 'undefined') {
                    alert('❌ FileSaver ライブラリが読み込まれていません。インターネット接続を確認してください。');
                    return;
                }

                const zip = new JSZip();

                // [Content_Types].xml
                const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
    <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
    <Default Extension="xml" ContentType="application/xml"/>
    <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

                // _rels/.rels
                const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
    <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

                // word/_rels/document.xml.rels
                const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
</Relationships>`;

                // word/document.xml
                const document = generateDocumentXml(formData);

                // ZIPに追加
                zip.file('[Content_Types].xml', contentTypes);
                zip.folder('_rels').file('.rels', rels);
                zip.folder('word').file('document.xml', document);
                zip.folder('word/_rels').file('document.xml.rels', docRels);

                // ダウンロード
                zip.generateAsync({ type: 'blob' }).then(blob => {
                    saveAs(blob, `議事録_${formData.get('date')}.docx`);
                    alert('✅ Word形式でダウンロードしました！');
                }).catch(err => {
                    alert('❌ エラーが発生しました: ' + err.message);
                    console.error(err);
                });

            } catch (err) {
                alert('❌ エラーが発生しました: ' + err.message);
                console.error(err);
            }
        }

        function generateDocumentXml(formData) {
            const title = escapeXml(formData.get('title'));
            const date = escapeXml(formData.get('date'));
            const timeStart = escapeXml(formData.get('time_start'));
            const timeEnd = escapeXml(formData.get('time_end'));
            const location = escapeXml(formData.get('location'));
            const participants = escapeXml(formData.get('participants'));
            const creator = escapeXml(formData.get('creator'));
            const goal = escapeXml(formData.get('goal'));
            const issues = escapeXml(formData.get('issues'));
            const discussion = escapeXml(formData.get('discussion'));
            const decision = escapeXml(formData.get('decision'));
            const nextMeeting = escapeXml(formData.get('next_meeting'));

            let actionRows = '';
            for (let i = 0; i < actionCount; i++) {
                const assignee = formData.get(`assignee_${i}`);
                if (assignee) {
                    const task = escapeXml(formData.get(`task_${i}`));
                    const deadline = escapeXml(formData.get(`deadline_${i}`));
                    const status = escapeXml(formData.get(`status_${i}`));
                    actionRows += `
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${escapeXml(assignee)}</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="2500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${task}</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${deadline}</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="1000" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${status}</w:t></w:r></w:p></w:tc>
            </w:tr>`;
                }
            }

            return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
            xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
            xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
    <w:body>
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading1"/>
                <w:jc w:val="center"/>
            </w:pPr>
            <w:r>
                <w:rPr>
                    <w:b/>
                    <w:sz w:val="32"/>
                </w:rPr>
                <w:t>【議事録】${title}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading2"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>1. 会議の概要</w:t>
            </w:r>
        </w:p>
        <w:tbl>
            <w:tblPr>
                <w:tblW w:w="5000" w:type="auto"/>
                <w:tblBorders>
                    <w:top w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:left w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:bottom w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:right w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:insideH w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:insideV w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                </w:tblBorders>
            </w:tblPr>
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>日時</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="3500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${date} ${timeStart} 〜 ${timeEnd}</w:t></w:r></w:p></w:tc>
            </w:tr>
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>場所</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="3500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${location}</w:t></w:r></w:p></w:tc>
            </w:tr>
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>参加者</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="3500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${participants}</w:t></w:r></w:p></w:tc>
            </w:tr>
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>議事録作成者</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="3500" w:type="dxa"/></w:tcPr><w:p><w:r><w:t>${creator}</w:t></w:r></w:p></w:tc>
            </w:tr>
        </w:tbl>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading2"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>2. 本日のゴール（開始5分で確認）</w:t>
            </w:r>
        </w:p>
        <w:p>
            <w:r>
                <w:t>${goal}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading2"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>3. 議論・傾聴内容（「口2：耳8」の記録）</w:t>
            </w:r>
        </w:p>
        ${issues ? `
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading3"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>【課題・現状の共有】</w:t>
            </w:r>
        </w:p>
        <w:p>
            <w:r>
                <w:t>${issues}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        ` : ''}
        ${discussion ? `
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading3"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>【主な議論・アイデア】</w:t>
            </w:r>
        </w:p>
        <w:p>
            <w:r>
                <w:t>${discussion}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        ` : ''}
        ${decision ? `
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading3"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>【意思決定・結論】</w:t>
            </w:r>
        </w:p>
        <w:p>
            <w:r>
                <w:t>${decision}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        ` : ''}
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading2"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>4. ネクストアクション（誰が・何を・いつまでに）</w:t>
            </w:r>
        </w:p>
        <w:tbl>
            <w:tblPr>
                <w:tblW w:w="5000" w:type="auto"/>
                <w:tblBorders>
                    <w:top w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:left w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:bottom w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:right w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:insideH w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                    <w:insideV w:val="single" w:sz="12" w:space="0" w:color="000000"/>
                </w:tblBorders>
            </w:tblPr>
            <w:tr>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>担当者</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="2500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>タスク内容</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="1500" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>期限</w:t></w:r></w:p></w:tc>
                <w:tc><w:tcPr><w:tcW w:w="1000" w:type="dxa"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>ステータス</w:t></w:r></w:p></w:tc>
            </w:tr>
            ${actionRows}
        </w:tbl>
        <w:p><w:r><w:t></w:t></w:r></w:p>
        <w:p>
            <w:pPr>
                <w:pStyle w:val="Heading2"/>
            </w:pPr>
            <w:r>
                <w:rPr><w:b/></w:rPr>
                <w:t>5. 次回開催について</w:t>
            </w:r>
        </w:p>
        <w:p>
            <w:r>
                <w:t>${nextMeeting}</w:t>
            </w:r>
        </w:p>
        <w:p><w:r><w:t></w:t></w:r></w:p>
    </w:body>
</w:document>`;
        }

        function escapeXml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&apos;');
        }
    </script>
